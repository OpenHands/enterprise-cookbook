---
name: Probe docs write access

on:
    pull_request:

permissions: {}

jobs:
    probe:
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-24.04
        steps:
            - id: app
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
              continue-on-error: true
              with:
                  app-id: ${{ secrets.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  owner: OpenHands
                  repositories: docs

            - id: app_scoped
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
              continue-on-error: true
              with:
                  app-id: ${{ secrets.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  owner: OpenHands
                  repositories: docs
                  permission-contents: write
                  permission-pull-requests: write

            - name: Report scoped
              run: "echo \"App token with contents:write + pull-requests:write: ${{ steps.app_scoped.outcome == 'success' }}\""

            - name: Report (booleans only)
              env:
                  APP_TOKEN: ${{ steps.app.outputs.token }}
                  PAT: ${{ secrets.OPENHANDS_BOT_GITHUB_PAT_PUBLIC }}
              run: |
                  echo "App token minted for docs: ${{ steps.app.outcome == 'success' }}"
                  for name in APP_TOKEN PAT; do
                    if [ -z "${!name}" ]; then echo "$name: unavailable"; continue; fi
                    GH_TOKEN="${!name}" gh api repos/OpenHands/docs --jq "\"$name push=\(.permissions.push // \"n/a\")\"" \
                      || echo "$name: docs not accessible"
                  done
                  if [ -n "$PAT" ]; then
                    echo "PAT identity: $(GH_TOKEN="$PAT" gh api user --jq .login)"
                  fi
