[project]
name = "warm-sandbox-pool"
version = "0.1.0"
description = "Warm Sandbox Pool demonstration for OpenHands"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "requests>=2.31.0",
]

[project.scripts]
pool-controller = "pool_controller:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
